<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaptureEcran</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="icons/icon32.png" alt="CaptureEcran" class="logo">
            <h1>CaptureEcran</h1>
        </header>
        
        <div class="capture-section">
            <button id="captureBtn" class="capture-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                </svg>
                Capturer la page complète
            </button>
            
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText">Capture en cours...</span>
            </div>
        </div>
        
        <div class="options-section">
            <h3>Options d'export</h3>
            
            <div class="format-group">
                <label class="format-option">
                    <input type="radio" name="format" value="png" checked>
                    <span class="format-label">
                        <strong>PNG</strong>
                        <small>Qualité parfaite, taille plus importante</small>
                    </span>
                </label>
                
                <label class="format-option">
                    <input type="radio" name="format" value="jpeg">
                    <span class="format-label">
                        <strong>JPEG</strong>
                        <small>Bonne qualité, taille optimisée</small>
                    </span>
                </label>
                
                <label class="format-option">
                    <input type="radio" name="format" value="pdf">
                    <span class="format-label">
                        <strong>PDF</strong>
                        <small>Format document, recherche possible</small>
                    </span>
                </label>
            </div>
            
            <div class="quality-section" id="qualitySection" style="display: none;">
                <label for="quality">Qualité JPEG :</label>
                <input type="range" id="quality" min="10" max="100" value="85" step="5">
                <span id="qualityValue">85%</span>
            </div>
            
        </div>
        
        <div class="settings-section">
            <button id="galleryBtn" class="settings-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
                Historique & Galerie
            </button>
            <button id="settingsBtn" class="settings-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="m12 1 0 6m0 6 0 6m11-7-6 0m-6 0-6 0"/>
                </svg>
                Paramètres
            </button>
        </div>
        
        <div class="status-section" id="statusSection" style="display: none;">
            <div class="status-message" id="statusMessage"></div>
        </div>
        
        <footer>
            <div class="version">v1.0.0</div>
            <div class="links">
                <a href="#" id="helpLink">Aide</a>
                <span>•</span>
                <a href="#" id="feedbackLink">Feedback</a>
            </div>
        </footer>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
