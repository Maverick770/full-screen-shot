<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie - CaptureEcran</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <div class="gallery-container">
        <header class="gallery-header">
            <div class="header-left">
                <img src="icons/icon32.png" alt="CaptureEcran" class="logo">
                <h1>Historique des captures</h1>
            </div>
            <div class="header-right">
                <button id="closeBtn" class="icon-btn" title="Fermer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="toolbar">
            <div class="search-container">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Rechercher par titre, URL ou nom de fichier...">
            </div>

            <div class="filters">
                <select id="formatFilter">
                    <option value="">Tous les formats</option>
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                    <option value="pdf">PDF</option>
                </select>

                <select id="sortFilter">
                    <option value="newest">Plus récent</option>
                    <option value="oldest">Plus ancien</option>
                    <option value="title">Titre (A-Z)</option>
                </select>
            </div>

            <div class="actions">
                <button id="selectAllBtn" class="btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                    Tout sélectionner
                </button>
                <button id="deleteSelectedBtn" class="btn-danger" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    Supprimer (<span id="selectedCount">0</span>)
                </button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">Total:</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">PNG:</span>
                <span class="stat-value" id="pngCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">JPEG:</span>
                <span class="stat-value" id="jpegCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">PDF:</span>
                <span class="stat-value" id="pdfCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Espace:</span>
                <span class="stat-value" id="totalSize">0 MB</span>
            </div>
        </div>

        <div class="gallery-content">
            <div id="loadingMessage" class="message">
                <div class="spinner"></div>
                <p>Chargement de l'historique...</p>
            </div>

            <div id="emptyMessage" class="message" style="display: none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                </svg>
                <p>Aucune capture enregistrée</p>
                <small>Capturez votre première page pour commencer</small>
            </div>

            <div id="noResultsMessage" class="message" style="display: none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <p>Aucun résultat</p>
                <small>Essayez avec d'autres critères de recherche</small>
            </div>

            <div id="galleryGrid" class="gallery-grid"></div>
        </div>
    </div>

    <!-- Modal de prévisualisation -->
    <div id="previewModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="previewTitle"></h2>
                <button id="closeModalBtn" class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <img id="previewImage" src="" alt="Preview">
                <div class="preview-info">
                    <div class="info-row">
                        <span class="info-label">URL:</span>
                        <a id="previewUrl" href="#" target="_blank"></a>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Fichier:</span>
                        <span id="previewFilename"></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Format:</span>
                        <span id="previewFormat"></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Date:</span>
                        <span id="previewDate"></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Taille:</span>
                        <span id="previewSize"></span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="downloadBtn" class="btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Télécharger
                </button>
                <button id="openUrlBtn" class="btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                        <polyline points="15 3 21 3 21 9"/>
                        <line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                    Ouvrir la page
                </button>
                <button id="deleteBtn" class="btn-danger">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    Supprimer
                </button>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
