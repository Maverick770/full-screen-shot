<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique - CaptureEcran Pro</title>
    <link rel="stylesheet" href="history.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <h1>Historique des captures</h1>
                </div>
                <div class="header-actions">
                    <input type="search" id="searchInput" placeholder="Rechercher..." class="search-input">
                    <button id="btnClearAll" class="btn btn-danger">Vider l'historique</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Stats -->
    <section class="stats-section">
        <div class="container">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📸</div>
                    <div class="stat-content">
                        <div class="stat-value" id="totalCaptures">0</div>
                        <div class="stat-label">Captures totales</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💾</div>
                    <div class="stat-content">
                        <div class="stat-value" id="totalSize">0 MB</div>
                        <div class="stat-label">Espace utilisé</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏰</div>
                    <div class="stat-content">
                        <div class="stat-value" id="lastCapture">Jamais</div>
                        <div class="stat-label">Dernière capture</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Filtres -->
    <section class="filters-section">
        <div class="container">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Toutes</button>
                <button class="filter-btn" data-filter="png">PNG</button>
                <button class="filter-btn" data-filter="jpeg">JPEG</button>
                <button class="filter-btn" data-filter="webp">WebP</button>
                <button class="filter-btn" data-filter="pdf">PDF</button>
            </div>
            <div class="view-toggles">
                <button class="view-btn active" data-view="grid">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                </button>
                <button class="view-btn" data-view="list">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="8" y1="6" x2="21" y2="6"/>
                        <line x1="8" y1="12" x2="21" y2="12"/>
                        <line x1="8" y1="18" x2="21" y2="18"/>
                        <line x1="3" y1="6" x2="3.01" y2="6"/>
                        <line x1="3" y1="12" x2="3.01" y2="12"/>
                        <line x1="3" y1="18" x2="3.01" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>
    </section>

    <!-- Grille de captures -->
    <main class="main">
        <div class="container">
            <div class="captures-grid" id="capturesGrid">
                <!-- Les captures seront injectées ici -->
            </div>

            <!-- Empty state -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <h2>Aucune capture</h2>
                <p>Commencez par capturer une page avec Ctrl+Shift+S</p>
            </div>
        </div>
    </main>

    <!-- Modale de prévisualisation -->
    <div class="modal" id="previewModal" style="display: none;">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">×</button>
            <img id="previewImage" src="" alt="Preview">
            <div class="modal-info">
                <h3 id="modalTitle">Titre</h3>
                <p id="modalDetails">Détails</p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="btnDownload">Télécharger</button>
                <button class="btn btn-secondary" id="btnCopy">Copier</button>
                <button class="btn btn-danger" id="btnDelete">Supprimer</button>
            </div>
        </div>
    </div>

    <script src="history.js"></script>
</body>
</html>
