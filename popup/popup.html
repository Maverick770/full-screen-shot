<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaptureEcran Pro</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-section">
                <svg class="logo-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <div class="logo-text">
                    <h1>CaptureEcran</h1>
                    <span class="badge">PRO</span>
                </div>
            </div>
        </header>

        <!-- Modes de capture -->
        <section class="capture-modes">
            <h2>Mode de capture</h2>
            <div class="modes-grid">
                <button class="mode-btn" id="btnFullPage" title="Ctrl+Shift+S">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 3H3v18h18V3z"/>
                        <path d="M3 9h18M3 15h18"/>
                    </svg>
                    <span>Page complète</span>
                    <small>Ctrl+Shift+S</small>
                </button>

                <button class="mode-btn" id="btnVisible" title="Ctrl+Shift+V">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    </svg>
                    <span>Zone visible</span>
                    <small>Ctrl+Shift+V</small>
                </button>

                <button class="mode-btn" id="btnSelection" title="Ctrl+Shift+A">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h6v6H4zM14 4h6v6h-6zM14 14h6v6h-6zM4 14h6v6H4z" stroke-dasharray="2 2"/>
                    </svg>
                    <span>Sélection</span>
                    <small>Ctrl+Shift+A</small>
                </button>

                <button class="mode-btn" id="btnElement">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
                        <line x1="16" y1="8" x2="2" y2="22"/>
                    </svg>
                    <span>Élément</span>
                    <small>Picker</small>
                </button>
            </div>
        </section>

        <!-- Options -->
        <section class="options">
            <h2>Options d'export</h2>

            <!-- Format -->
            <div class="option-group">
                <label>Format</label>
                <div class="format-btns">
                    <button class="format-btn active" data-format="png">PNG</button>
                    <button class="format-btn" data-format="jpeg">JPEG</button>
                    <button class="format-btn" data-format="webp">WebP</button>
                    <button class="format-btn" data-format="pdf">PDF</button>
                </div>
            </div>

            <!-- Qualité (pour JPEG/WebP) -->
            <div class="option-group" id="qualityGroup" style="display: none;">
                <label>
                    Qualité
                    <span class="quality-value" id="qualityValue">85%</span>
                </label>
                <input type="range" id="quality" min="10" max="100" value="85" step="5" class="slider">
            </div>

            <!-- Actions rapides -->
            <div class="option-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="copyToClipboard">
                    <span>Copier vers le presse-papier</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="saveToHistory" checked>
                    <span>Enregistrer dans l'historique</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="openEditor">
                    <span>Ouvrir dans l'éditeur</span>
                </label>
            </div>
        </section>

        <!-- Actions rapides -->
        <section class="quick-actions">
            <button class="action-btn" id="btnHistory" title="Ctrl+Shift+H">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="1 4 1 10 7 10"/>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                </svg>
                Historique
            </button>
            <button class="action-btn" id="btnSettings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v6m0 6v10M1 12h6m6 0h10"/>
                </svg>
                Paramètres
            </button>
        </section>

        <!-- Progression -->
        <div class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">Capture en cours...</p>
        </div>

        <!-- Message de statut -->
        <div class="status-message" id="statusMessage" style="display: none;"></div>

        <!-- Footer -->
        <footer class="footer">
            <div class="stats" id="stats">
                <span id="captureCount">0 capture</span>
            </div>
            <div class="version">v2.0.0</div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
